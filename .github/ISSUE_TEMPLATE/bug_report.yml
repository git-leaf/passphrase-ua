name: Bug report
description: Something in Mova Pass doesn't work as it should
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: A security problem? Report it through a [private security advisory](https://github.com/git-leaf/passphrase-ua/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Never paste a password or passphrase you actually use.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Switch to Passphrase
        2. Choose an English Wordlist
        3. …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 150 on Android
