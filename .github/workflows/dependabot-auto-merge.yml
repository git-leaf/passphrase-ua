# Turns on squash auto-merge for Dependabot PRs that need no human decision, so
# they merge once the required checks pass. Policy: docs/adr/0003-automatic-dependency-updates.md
name: Dependabot auto-merge

# pull_request_target gives a write token; this workflow never checks out or runs the PR's code
on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Fails unless every commit on the PR is a verified Dependabot commit
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Major npm updates stay open: they can break the UI without failing CI
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
